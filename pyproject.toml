[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sputnik-ai-analytics"
version = "0.3.0"
description = "Local-first TradingView market telemetry, ChatGPT retrieval, and reproducible backtesting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yuri Oratch" }]
dependencies = [
  "certifi>=2025.1.31",
  "fastapi>=0.115,<1",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.8,<3",
  "pypdf>=6,<7",
  "PyYAML>=6.0",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
sputnik = "sputnik.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

name: Security checks

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . bandit pip-audit
      - run: bandit -q -r src -lll
      - run: pip-audit

  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
